name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'daily-stars-staging' || github.run_id }}
  queue: max

jobs:
  milestone-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Build staging Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:staging
      - name: Migrate staging D1 and deploy Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --no-install wrangler d1 migrations apply daily-stars-staging --config wrangler.jsonc --env staging --remote
          npx --no-install wrangler deploy --config dist/daily_stars_local/wrangler.json
